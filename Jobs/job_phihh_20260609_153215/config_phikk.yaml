     -  ["Jpsi->K3(2320)p.kmK3(2320)p->phi.kp_total_0i", "Jpsi->K3(2320)m.kpK3(2320)m->phi.km_total_0i"]
     -  ["Jpsi->K3(2320)p.km_g_ls_0i", "Jpsi->K3(2320)m.kp_g_ls_0i"]
     -  ["Jpsi->K3(2320)p.km_g_ls_1i", "Jpsi->K3(2320)m.kp_g_ls_1i"]

#    -  ["Jpsi->K4(2045)p.kmK4(2045)p->phi.kp_total_0i", "Jpsi->K4(2045)m.kpK4(2045)m->phi.km_total_0i"]
#    -  ["Jpsi->K4(2045)p.km_g_ls_0i", "Jpsi->K4(2045)m.kp_g_ls_0i"]
#    -  ["Jpsi->K4(2045)p.km_g_ls_1i", "Jpsi->K4(2045)m.kp_g_ls_1i"]


plot:
    config:
        bins: 100
        legend: False
    mass:
        kstp:
            display: "$M(\\phi K^{+})$"
        kstm:
            display: "$M(\\phi K^{-})$"
        kk:
            display: "$M(K^{+}K^{-})$"
            bins: 150
            legend: True

    angle:
        Jpsi/kstp/kp:
            alpha:
                display: "$\\phi(\\theta_{\\phi K^{+}}^{K^{+}})$"
            cos(beta):
                display: "$\\cos(\\theta_{\\phi K^{+}}^{K^{+}})$"
                legend: False
        Jpsi/kk/kp:
            cos(beta):
                display: "$\\cos(\\theta_{K^+K^-}^{K^+})$"

    2Dplot:
        dalitz_phiKp_KpKm:
            x: m_kk**2
            y: m_kstp**2
            display: "$M(\\phi K^{+})^2$ vs $M(K^{+} K^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]
        dalitz_phiKm_KpKm:
            x: m_kk**2
            y: m_kstm**2
            display: "$M(\\phi K^{-})^2$ vs $M(K^{+} K^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]
        dalitz_phiKp_phiKm:
            x: m_kstp**2
            y: m_kstm**2
            display: "$M(\\phi K^{+})^2$ vs $M(\\phi K^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]

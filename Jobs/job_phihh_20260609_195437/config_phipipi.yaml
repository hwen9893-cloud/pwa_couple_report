data:
    dat_order: [phi, pip, pim]

    # TODO: 替换为实际 J/ψ → φπ⁺π⁻ 数据路径
    #data:        [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_p5C_data.dat"], ["/hpcfs/bes/gpupwa/wenhw/dat_yuren/12_p5C_data.dat"]]
    data:        [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_p5C_data.dat"]]
    #data_weight: [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_sweight_data.dat"],["/hpcfs/bes/gpupwa/wenhw/dat_yuren/12_sweight_data.dat"]]
    data_weight: [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_sweight_data.dat"]]

    #phsp:        [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_p5C_phsp_sub.dat"],["/hpcfs/bes/gpupwa/wenhw/dat_yuren/12_p5C_phsp_sub.dat"]]
    phsp:        [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_p5C_phsp_sub.dat"]]
    #phsp_weight: [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_sweight_phsp_sub.dat"],["/hpcfs/bes/gpupwa/wenhw/dat_yuren/12_sweight_phsp_sub.dat"]]
    phsp_weight: [["/hpcfs/bes/gpupwa/wenhw/dat_yuren/09_sweight_phsp_sub.dat"]]

    # phsp_noeff 路径仍待确认（README 中标 "待确认"）。
    # 暂时关闭 → 拟合本身完全正常；fit_witherr_fs.py 会自动跳过此道的 fit fraction。
    # phsp_noeff: ["/hpcfs/bes/gpupwa/wenhw/noeff_phsp/phsp_noeff_phipipi_100k.dat"]

    r_boost: True
    random_z: False
    center_mass: True

    lazy_call: False
    amp_model: cached_shape
    preprocessor: cached_shape
    use_tf_function: True

    # 显存不大时建议开启：
    # cached_data: "./all_data.npy"
    # cached_lazy_file: "./lazy_cache.npz"

decay:
    Jpsi:
        - [bp,  pim, barrier_factor_norm: True]
        - [bm,  pip, barrier_factor_norm: True]
        - [phi, pipi, barrier_factor_norm: True]
    bp:
        - [phi, pip, barrier_factor_norm: True]
    bm:
        - [phi, pim, barrier_factor_norm: True]
    pipi:
        - [pip, pim, barrier_factor_norm: True]


particle:
    $top:
        Jpsi: { J: 1, P: -1, spins: [-1, 1], mass: 3.0969, width: 0 }
    $finals:
        pip: { J: 0, P: -1, mass: 0.13957039, width: 0.0000, display: "$\\pi^{+}$" }
        pim: { J: 0, P: -1, mass: 0.13957039, width: 0.0000, display: "$\\pi^{-}$" }
        phi: { J: 1, P: -1, mass: 1.01946,    width: 0.000,  display: "$\\phi$" }
    $include:
        - ./Resonances.yaml
        - ./States_phipipi.yaml


constrains:
    decay: { fix_chain_idx: 0, fix_chain_val: 1 }
    # Flatte 耦合常数 g_0 / g_1 必须 >= 0（避免 g 反号造成的离散二义性）
    # 这些参数与 config_phikk.yaml 共享 → 在两个 yaml 都写一份保证 MultiConfig 都见到
    var_range:
        "f0(980)_flatte_g_0":  [0.0, null]
        "f0(980)_flatte_g_1":  [0.0, null]
        "f2(1270)_flatte_g_0": [0.0, null]
        "f2(1270)_flatte_g_1": [0.0, null]
        "f0(1370)_flatte_g_0": [0.0, null]
        "f0(1370)_flatte_g_1": [0.0, null]
        "f2(1430)_flatte_g_0": [0.0, null]
        "f2(1430)_flatte_g_1": [0.0, null]
        "f0(1500)_flatte_g_0": [0.0, null]
        "f0(1500)_flatte_g_1": [0.0, null]
    var_equal:

     -  ["Jpsi->b1(1235)p.pimb1(1235)p->phi.pip_total_0i", "Jpsi->b1(1235)m.pipb1(1235)m->phi.pim_total_0i"]
     -  ["Jpsi->b1(1235)p.pim_g_ls_0i", "Jpsi->b1(1235)m.pip_g_ls_0i"]
     -  ["Jpsi->b1(1235)p.pim_g_ls_1i", "Jpsi->b1(1235)m.pip_g_ls_1i"]
     -  ["Jpsi->NR_0-_bp.pimNR_0-_bp->phi.pip_total_0i", "Jpsi->NR_0-_bm.pipNR_0-_bm->phi.pim_total_0i"]
     -  ["Jpsi->NR_0-_bp.pim_g_ls_0i", "Jpsi->NR_0-_bm.pip_g_ls_0i"]
     -  ["Jpsi->NR_0-_bp.pim_g_ls_1i", "Jpsi->NR_0-_bm.pip_g_ls_1i"]
     -  ["Jpsi->rho(1450)p.pimrho(1450)p->phi.pip_total_0i", "Jpsi->rho(1450)m.piprho(1450)m->phi.pim_total_0i"]
     -  ["Jpsi->rho(1450)p.pim_g_ls_0i", "Jpsi->rho(1450)m.pip_g_ls_0i"]
     -  ["Jpsi->rho(1450)p.pim_g_ls_1i", "Jpsi->rho(1450)m.pip_g_ls_1i"]
     -  ["Jpsi->rho(1570)p.pimrho(1570)p->phi.pip_total_0i", "Jpsi->rho(1570)m.piprho(1570)m->phi.pim_total_0i"]
     -  ["Jpsi->rho(1570)p.pim_g_ls_0i", "Jpsi->rho(1570)m.pip_g_ls_0i"]
     -  ["Jpsi->rho(1570)p.pim_g_ls_1i", "Jpsi->rho(1570)m.pip_g_ls_1i"]
     -  ["Jpsi->rho(1690)p.pimrho(1690)p->phi.pip_total_0i", "Jpsi->rho(1690)m.piprho(1690)m->phi.pim_total_0i"]
     -  ["Jpsi->rho(1690)p.pim_g_ls_0i", "Jpsi->rho(1690)m.pip_g_ls_0i"]
     -  ["Jpsi->rho(1690)p.pim_g_ls_1i", "Jpsi->rho(1690)m.pip_g_ls_1i"]


plot:
    config:
        bins: 200
        legend: False
    mass:
        bp:
            display: "$M(\\phi\\pi^{+})$"
            range: [1.0, 3.0]
        bm:
            display: "$M(\\phi\\pi^{-})$"
            range: [1.0, 3.0]
        pipi:
            display: "$M(\\pi^{+}\\pi^{-})$"
            legend: True

    angle:
        Jpsi/bp/pip:
            alpha:
                display: "$\\phi(\\theta_{\\phi\\pi^{+}}^{\\pi^{+}})$"
            cos(beta):
                display: "$\\cos(\\theta_{\\phi\\pi^{+}}^{\\pi^{+}})$"
        Jpsi/pipi/pip:
            cos(beta):
                display: "$\\cos(\\theta_{\\pi^+\\pi^-}^{\\pi^+})$"

    2Dplot:
        dalitz_phiPip_phiPim:
            x: m_bp**2
            y: m_bm**2
            display: "$M(\\phi\\pi^{+})^2$ vs $M(\\phi\\pi^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]
        dalitz_phiPip_PipPim:
            x: m_bp**2
            y: m_pipi**2
            display: "$M(\\phi\\pi^{+})^2$ vs $M(\\pi^{+}\\pi^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]
        dalitz_phiPim_PipPim:
            x: m_bm**2
            y: m_pipi**2
            display: "$M(\\phi\\pi^{-})^2$ vs $M(\\pi^{+}\\pi^{-})^2$"
            plot_figs: ["data_hist", "fitted", "pull"]

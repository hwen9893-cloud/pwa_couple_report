# Initial states for J/ψ → φπ⁺π⁻
# Analog of omegahh/States_omegapipi.yaml with phi replacing omega.
# Uncomment entries to extend the model during significance scan.

bp:  
    # φπ⁺ subsystem  (I=1)
#    - b1(1235)p
#    - NR_0-_bp
    - rho(1450)p
    - rho(1570)p
    - rho(1690)p
    # - NR_0+_bp
    # - NR_1/2+_bp

bm: 
    # φπ⁻ subsystem  (I=1, charge-conjugate of bp)
#    - b1(1235)m
#    - NR_0-_bm
    - rho(1450)m
    - rho(1570)m
    - rho(1690)m
    # - NR_0+_bm
    # - NR_1/2+_bm

pipi:
    # π⁺π⁻ subsystem  (same isoscalar resonances as φKK channel)
    # 带 _flatte 后缀的资源在 KK / ππ 道之间共享 g_0、g_1（耦合道分析的真正耦合点）。
#    - NR_pipi_0+
#    - NR_pipi_flat_0+
    - NR_pipi_flat_2+
#    - NR_pipi_2+
    - f0(500)_E791
    - f0(980)_flatte
    - f2(1270)
#    - f0(1370)_flatte
    - f0(1370)
    - f0(1500)_flatte
#    - f2(1525)
#    - f2(1565)
    - f0(1710)
    - f2(1430)
